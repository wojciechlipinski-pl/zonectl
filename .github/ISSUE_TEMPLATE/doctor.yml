name: ZoneCTL Doctor report
description: Submit a privacy-reviewed diagnostic report generated by zctl doctor
title: "[doctor] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not paste zone names, IP addresses, host names, environment paths,
        contact data, keys, DS digests, credentials or unreviewed system logs.
  - type: textarea
    id: doctor-report
    attributes:
      label: Privacy-reviewed doctor report
      description: Paste only the report generated by `zctl doctor --prepare-issue`.
      placeholder: Paste the complete zonectl.doctor-report/v1 body here.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed the report and it contains no production identifiers or secrets.
          required: true
