name: Public data guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-data-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Reject production DNS names
        run: python -m pytest -q tests/test_public_example_privacy.py
