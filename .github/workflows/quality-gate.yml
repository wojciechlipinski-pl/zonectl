name: Quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Incremental static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned analysis dependency
        run: python -m pip install --disable-pip-version-check "mypy>=1.20,<1.21"
      - name: Type-check new critical modules
        env:
          MYPYPATH: src
        run: |
          python -m mypy \
            src/zonectl/core/zone_quarantine_retention.py \
            src/zonectl/core/zone_quarantine_purge.py \
            src/zonectl/core/zone_create_transaction.py \
            src/zonectl/core/zone_disable_transaction.py \
            src/zonectl/core/zone_restore_transaction.py \
            scripts/audit_public_api.py

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install isolated test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bind9-utils bind9-dnsutils
          python -m pip install --disable-pip-version-check pytest
      - name: Run tests without production BIND access
        env:
          PYTHONPATH: src
        run: python -m pytest -q

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Require documented public API in new critical modules
        run: |
          python scripts/audit_public_api.py --strict \
            src/zonectl/core/zone_quarantine_retention.py \
            src/zonectl/core/zone_quarantine_purge.py \
            src/zonectl/core/zone_create_transaction.py \
            src/zonectl/core/zone_disable_transaction.py \
            src/zonectl/core/zone_restore_transaction.py \
            src/zonectl/core/zone_quarantine.py \
            src/zonectl/core/zone_quarantine_restore.py \
            src/zonectl/core/managed_zone_migration_transaction.py \
            src/zonectl/core/managed_zone_relocation_transaction.py
      - name: Reject whitespace errors
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD
      - name: Reject executable documentation and Python sources
        shell: bash
        run: |
          unexpected="$({
            git ls-files -s -- '*.md' '*.yml' '*.yaml' 'src/**/*.py' 'tests/**/*.py'
          } | awk '$1 == "100755" { print $4 }')"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected executable files:\n%s\n' "$unexpected"
            exit 1
          fi
